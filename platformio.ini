; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = Astra

[env]
lib_deps =
	https://github.com/Terrapin-Rocket-Team/Astra.git#main
	https://github.com/DrewBrandt/arc-protocol.git
lib_compat_mode = strict
build_flags =
	-Wno-unknown-pragmas
	-std=gnu++17
	-DIGNORE_EXAMPLE_USAGE
build_src_filter = +<*>
extra_scripts = pre:get_version.py

[env:teensy42]
platform = teensy
framework = arduino
board = teensy41
build_flags =
	${env.build_flags}
	-DENV_TEENSY
build_src_filter = +<*> +<../examples/BasicTeensyExample/**>

[env:teensy41]
platform = teensy
framework = arduino
board = teensy41
build_flags =
	${env.build_flags}
	-DENV_TEENSY
build_src_filter = +<*> +<../examples/MahonyFilterTest/**>

[env:stm]
platform = ststm32
framework = arduino
board = stm32h723vehx
board_build.variants_dir = custom_variants
board_build.variant = stm32h723vehx
board_build.ldscript = ldscripts/ldscript.ld
lib_deps =
	${env.lib_deps}
build_flags =
	${env.build_flags}
	-D ENV_STM
	-D STM32
	-D ARDUINO_GENERIC_H723VEHX
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USE_USB_HS
    -D USE_USB_HS_IN_FS
    -Wl,-u,_printf_float
    -Wl,-u,_scanf_float
build_src_filter = +<*> +<../examples/BasicSTM32Example/**>
lib_ignore =
	${env.lib_ignore}

; Deprecated local hardware bring-up environment.
; Kept as a non-env section so shared CI/test tooling doesn't attempt to build it.
[stm_test]
platform = ststm32
framework = arduino
board = stm32h723vehx
board_build.variants_dir = custom_variants
board_build.variant = stm32h723vehx
board_build.ldscript = ldscripts/ldscript.ld
lib_deps =
	${env.lib_deps}
build_flags =
	${env.build_flags}
	-DENV_STM
	-DUSE_SIMPLE_STORAGE=1
	-I examples/I2CSensorTest
	-I .pio/libdeps/stm_test/TRT-Astra/src
build_src_filter = +<*> +<../examples/I2CSensorTest/**>
lib_ignore =
	${env.lib_ignore}

[env:esp32]
platform = espressif32
framework = arduino
board = esp32-s3-devkitm-1
build_flags =
	${env.build_flags}
	-DENV_ESP
build_unflags = -std=gnu++11

[env:native]
platform = native
lib_deps =
	${env.lib_deps}
	throwtheswitch/Unity@^2.6.0
	https://github.com/DrewBrandt/NativeTestMocks.git
lib_ignore = SdFat
lib_compat_mode = off
test_build_src = yes
build_flags =
	-Wno-unknown-pragmas
	-std=c++17
	-DARDUINO=100 ; adafruit library needs it in order to compile
	-DNATIVE=1
	-DDEBUG=1 ; print debug messages
	-DNATIVE_NO_STDOUT_DATA=1 ; keep TELEM on socket/log sinks only (no stdout echo)
	-DNOLOGI=1 ; don't print info logs on native
	-DUNITY_INCLUDE_DOUBLE
	-lws2_32
	-fpermissive
test_framework = unity
lib_ldf_mode = chain+
build_src_filter =
	+<*>
	+<../examples/HITLExample/**>
debug_build_flags = -g -O0 -fstack-protector-all
; debug_test = test_rocket_sensor_manager
